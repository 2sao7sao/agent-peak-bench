<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">Harness Engineering Campaign Observability</title>
  <desc id="desc">A matrix mapping long-running campaign experiment dimensions to metrics and deployment decisions.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef8f4"/>
      <stop offset="55%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f9eadf"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#172026" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 800 34px Georgia, "Times New Roman", serif; fill: #172026; }
      .subtitle { font: 500 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #5f6c73; }
      .head { font: 750 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #5f6c73; letter-spacing: .08em; text-transform: uppercase; }
      .label { font: 750 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172026; }
      .text { font: 600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172026; }
      .muted { font: 500 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #5f6c73; }
    </style>
  </defs>

  <rect width="1120" height="620" rx="28" fill="url(#page)"/>
  <rect x="34" y="34" width="1052" height="552" rx="24" fill="#ffffff" stroke="#cfd7dc" filter="url(#shadow)"/>
  <text x="66" y="88" class="title">Long-running Harness Evaluation Campaign</text>
  <text x="66" y="118" class="subtitle">Run pilots, calibration cells, and confirmatory batches until boundary claims have enough sample size and CI95 support.</text>

  <g transform="translate(66 156)">
    <rect x="0" y="0" width="988" height="348" rx="14" fill="#f8faf9" stroke="#cfd7dc"/>
    <text x="22" y="32" class="head">Experiment dimension</text>
    <text x="292" y="32" class="head">Primary metrics</text>
    <text x="594" y="32" class="head">Deployment decision</text>
    <line x1="0" y1="48" x2="988" y2="48" stroke="#cfd7dc"/>
    <line x1="260" y1="0" x2="260" y2="348" stroke="#cfd7dc"/>
    <line x1="560" y1="0" x2="560" y2="348" stroke="#cfd7dc"/>

    <g transform="translate(0 48)">
      <rect x="0" y="0" width="988" height="50" fill="#ffffff"/>
      <circle cx="22" cy="25" r="9" fill="#1f7a68"/>
      <text x="42" y="30" class="label">Context panic window</text>
      <text x="292" y="21" class="text">pass@k, generated_context_chars, p95 latency</text>
      <text x="292" y="38" class="muted">schema pass rate, evidence loss</text>
      <text x="594" y="30" class="text">Context budget, compaction and retrieval threshold</text>
    </g>

    <g transform="translate(0 98)">
      <rect x="0" y="0" width="988" height="50" fill="#f8faf9"/>
      <circle cx="22" cy="25" r="9" fill="#b7410e"/>
      <text x="42" y="30" class="label">Plan mode</text>
      <text x="292" y="21" class="text">pass@1 vs pass@7, latency, verbosity drift</text>
      <text x="292" y="38" class="muted">premature closure and repair cost</text>
      <text x="594" y="30" class="text">No-plan, private plan, staged plan, or verifier loop</text>
    </g>

    <g transform="translate(0 148)">
      <rect x="0" y="0" width="988" height="50" fill="#ffffff"/>
      <circle cx="22" cy="25" r="9" fill="#2563eb"/>
      <text x="42" y="30" class="label">Single vs multi-agent</text>
      <text x="292" y="21" class="text">handoff completeness, role blur, integration failures</text>
      <text x="292" y="38" class="muted">end-to-end pass and total latency</text>
      <text x="594" y="30" class="text">Solo, planner-worker, content+harness, or integration owner</text>
    </g>

    <g transform="translate(0 198)">
      <rect x="0" y="0" width="988" height="50" fill="#f8faf9"/>
      <circle cx="22" cy="25" r="9" fill="#7c3aed"/>
      <text x="42" y="30" class="label">Tools and skills load</text>
      <text x="292" y="21" class="text">tool precision, required coverage, forbidden calls</text>
      <text x="292" y="38" class="muted">skill count, return length, router effects</text>
      <text x="594" y="30" class="text">Direct exposure limit, router threshold, skill contract style</text>
    </g>

    <g transform="translate(0 248)">
      <rect x="0" y="0" width="988" height="50" fill="#ffffff"/>
      <circle cx="22" cy="25" r="9" fill="#ca8a04"/>
      <text x="42" y="30" class="label">Context ambiguity</text>
      <text x="292" y="21" class="text">decision drift, stale-source bias, missing evidence</text>
      <text x="292" y="38" class="muted">conflicting evidence and implicit intent</text>
      <text x="594" y="30" class="text">Intent extraction, evidence conflict rules, approval gates</text>
    </g>

    <g transform="translate(0 298)">
      <rect x="0" y="0" width="988" height="50" fill="#f8faf9"/>
      <circle cx="22" cy="25" r="9" fill="#be123c"/>
      <text x="42" y="30" class="label">Model personality</text>
      <text x="292" y="21" class="text">laziness, over-compliance, verbosity, honesty</text>
      <text x="292" y="38" class="muted">exact consistency and failure taxonomy</text>
      <text x="594" y="30" class="text">System prompt constraints, verifier checks, repair loops</text>
    </g>
  </g>

  <g transform="translate(66 535)">
    <rect x="0" y="-20" width="150" height="34" rx="17" fill="#e8f4ef" stroke="#b9d8cc"/>
    <text x="23" y="2" class="text">Pilot n≈7/cell</text>
    <rect x="176" y="-20" width="190" height="34" rx="17" fill="#fff3df" stroke="#efd0ab"/>
    <text x="199" y="2" class="text">Calibration n≈30/cell</text>
    <rect x="392" y="-20" width="220" height="34" rx="17" fill="#eef2ff" stroke="#c8d2ff"/>
    <text x="415" y="2" class="text">Confirmatory n≈100/cell</text>
    <text x="650" y="2" class="muted">Strong claims require sample size, CI95, and stable failure taxonomy.</text>
  </g>
</svg>
