<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="640" viewBox="0 0 1040 640" role="img" aria-labelledby="title desc">
  <title id="title">MiniMax M2.7 High Radar Scores</title>
  <desc id="desc">Radar chart for Agent Peak Bench dimensions with compact axis labels and a separate legend.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
