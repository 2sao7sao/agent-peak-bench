<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-label="Agent Peak Bench multi-model dashboard sample">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e9f7f2"/>
      <stop offset="60%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fff0e0"/>
    </linearGradient>
    <style>
      .title{font:800 34px Georgia,'Times New Roman',serif;fill:#172026}
      .sub{font:600 14px 'Avenir Next','Trebuchet MS',sans-serif;fill:#5f6c73}
      .head{font:800 13px 'Avenir Next','Trebuchet MS',sans-serif;fill:#5f6c73;text-transform:uppercase}
      .name{font:800 18px 'Avenir Next','Trebuchet MS',sans-serif;fill:#172026}
      .small{font:600 12px 'Avenir Next','Trebuchet MS',sans-serif;fill:#5f6c73}
      .score{font:800 16px 'Avenir Next','Trebuchet MS',sans-serif;fill:#172026}
    </style>
  </defs>
  <rect width="1280" height="760" rx="34" fill="url(#bg)"/>
  <rect x="38" y="38" width="1204" height="684" rx="28" fill="#fff" stroke="#cfd7dc"/>
  <text x="72" y="92" class="title">Multi-Model Agent Deployment Dashboard</text>
  <text x="72" y="124" class="sub">Contract preview: MiniMax row is measured r7 pilot; reference rows are fixtures and not benchmark claims.</text>
  <text x="72" y="174" class="head">Model</text>
  <text x="398" y="174" class="head">Business fit</text>
  <text x="568" y="174" class="head">Tool reliability</text>
  <text x="748" y="174" class="head">Context stability</text>
  <text x="948" y="174" class="head">Harness dependency</text>
  <line x1="72" y1="196" x2="1208" y2="196" stroke="#e5eaee"/>
  <g transform="translate(72 226)">
    <text x="0" y="0" class="name">MiniMax M2.7 High</text>
    <text x="0" y="24" class="small">measured_live_r7_pilot</text>
    <rect x="326" y="-16" width="180" height="18" rx="9" fill="#e5eaee"/>
    <rect x="326" y="-16" width="77" height="18" rx="9" fill="#0f766e"/>
    <text x="516" y="-1" class="score">0.43</text>
    <rect x="496" y="-16" width="180" height="18" rx="9" fill="#e5eaee"/>
    <rect x="496" y="-16" width="130" height="18" rx="9" fill="#2563eb"/>
