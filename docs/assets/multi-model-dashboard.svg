  <line x1="72" y1="282" x2="1208" y2="282" stroke="#e5eaee"/>
  <g transform="translate(72 326)">
    <text x="0" y="0" class="name">Reference Strong Agent</text>
    <text x="0" y="24" class="small">fixture_not_measured</text>
    <rect x="326" y="-16" width="180" height="18" rx="9" fill="#e5eaee"/>
    <rect x="326" y="-16" width="133" height="18" rx="9" fill="#0f766e"/>
