    <rect x="676" y="-16" width="180" height="18" rx="9" fill="#e5eaee"/>
    <rect x="676" y="-16" width="74" height="18" rx="9" fill="#b7410e"/>
    <text x="866" y="-1" class="score">0.41</text>
    <rect x="876" y="-16" width="180" height="18" rx="9" fill="#e5eaee"/>
    <rect x="876" y="-16" width="162" height="18" rx="9" fill="#ca8a04"/>
    <text x="1066" y="-1" class="score">0.90</text>
  </g>
  <rect x="72" y="532" width="1136" height="124" rx="18" fill="#f8faf9" stroke="#e5eaee"/>
  <text x="96" y="570" class="head">How to read this</text>
  <text x="96" y="600" class="sub">Higher business/tool/context scores are better. Higher harness dependency means the model needs more router, verifier, retry, approval, or multi-agent scaffolding.</text>
  <text x="96" y="630" class="sub">Dashboard rows must carry status labels: measured_live, measured_offline, or fixture_not_measured.</text>
