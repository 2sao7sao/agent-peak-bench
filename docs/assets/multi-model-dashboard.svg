    <rect x="676" y="-16" width="180" height="18" rx="9" fill="#e5eaee"/>
    <rect x="676" y="-16" width="122" height="18" rx="9" fill="#b7410e"/>
    <text x="866" y="-1" class="score">0.68</text>
    <rect x="876" y="-16" width="180" height="18" rx="9" fill="#e5eaee"/>
    <rect x="876" y="-16" width="83" height="18" rx="9" fill="#ca8a04"/>
