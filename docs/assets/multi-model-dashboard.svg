  </g>
  <line x1="72" y1="382" x2="1208" y2="382" stroke="#e5eaee"/>
  <g transform="translate(72 426)">
    <text x="0" y="0" class="name">Reference Compact Model</text>
    <text x="0" y="24" class="small">fixture_not_measured</text>
    <rect x="326" y="-16" width="180" height="18" rx="9" fill="#e5eaee"/>
    <rect x="326" y="-16" width="67" height="18" rx="9" fill="#0f766e"/>
    <text x="516" y="-1" class="score">0.37</text>
    <rect x="496" y="-16" width="180" height="18" rx="9" fill="#e5eaee"/>
    <rect x="496" y="-16" width="86" height="18" rx="9" fill="#2563eb"/>
