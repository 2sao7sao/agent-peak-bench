<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc">
  <title id="title">Tool Evaluation Matrix</title>
  <desc id="desc">Design matrix for evaluating model behavior across tool profiles, return length, evidence extraction, and harness recommendations.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3fbf7"/>
      <stop offset="48%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fff3e7"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#172026" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 800 34px Georgia, "Times New Roman", serif; fill: #172026; }
      .subtitle { font: 500 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #5f6c73; }
      .axis { font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #5f6c73; letter-spacing: .08em; text-transform: uppercase; }
      .row { font: 700 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172026; }
      .cell { font: 650 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172026; }
      .note { font: 500 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #5f6c73; }
      .small { font: 600 10px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #5f6c73; }
    </style>
  </defs>

  <rect width="1120" height="660" rx="28" fill="url(#bg)"/>
  <rect x="34" y="34" width="1052" height="592" rx="24" fill="#ffffff" stroke="#cfd7dc" filter="url(#shadow)"/>

  <text x="66" y="88" class="title">Tool Return Profile Evaluation</text>
  <text x="66" y="118" class="subtitle">Controlled mock-MCP matrix for tool type, return length, noisy evidence, errors, and live-adapter readiness.</text>
  <text x="66" y="142" class="note">Status: design matrix. Run tool_return_profiles_v1 and live adapters to populate measured pass@k, latency, and tool precision.</text>

  <g transform="translate(66 180)">
    <rect x="0" y="0" width="988" height="386" rx="14" fill="#f8faf9" stroke="#cfd7dc"/>

    <text x="24" y="32" class="axis">Tool profile</text>
    <text x="238" y="32" class="axis">Return shape</text>
    <text x="392" y="32" class="axis">Main stress</text>
    <text x="575" y="32" class="axis">Risk</text>
    <text x="714" y="32" class="axis">Recommended harness</text>

    <line x1="0" y1="48" x2="988" y2="48" stroke="#cfd7dc"/>
    <line x1="210" y1="0" x2="210" y2="386" stroke="#cfd7dc"/>
    <line x1="365" y1="0" x2="365" y2="386" stroke="#cfd7dc"/>
    <line x1="548" y1="0" x2="548" y2="386" stroke="#cfd7dc"/>
    <line x1="690" y1="0" x2="690" y2="386" stroke="#cfd7dc"/>

    <g transform="translate(0 48)">
      <rect x="0" y="0" width="988" height="56" fill="#ffffff"/>
      <rect x="560" y="12" width="96" height="30" rx="15" fill="#dff3ea"/>
      <text x="24" y="34" class="row">Focused tools</text>
      <text x="238" y="25" class="cell">Short JSON</text>
      <text x="238" y="42" class="small">3 focused MCP tools</text>
      <text x="392" y="34" class="cell">Tool selection precision</text>
      <text x="587" y="33" class="cell">Lower</text>
      <text x="714" y="34" class="cell">Direct tools + schema validator</text>
    </g>

    <g transform="translate(0 104)">
      <rect x="0" y="0" width="988" height="56" fill="#f8faf9"/>
      <rect x="560" y="12" width="96" height="30" rx="15" fill="#ffe3cf"/>
      <text x="24" y="34" class="row">Flat overloaded</text>
      <text x="238" y="25" class="cell">Many similar tools</text>
      <text x="238" y="42" class="small">9-15 exposed tools</text>
      <text x="392" y="34" class="cell">Wrong-call and over-call</text>
      <text x="589" y="33" class="cell">High</text>
      <text x="714" y="25" class="cell">Router / ToolSearch / phase gates</text>
      <text x="714" y="42" class="small">Do not expose all tools at once</text>
    </g>

    <g transform="translate(0 160)">
      <rect x="0" y="0" width="988" height="56" fill="#ffffff"/>
      <rect x="560" y="12" width="96" height="30" rx="15" fill="#e9f0ff"/>
      <text x="24" y="34" class="row">Router compressed</text>
      <text x="238" y="25" class="cell">Evidence bundle</text>
      <text x="238" y="42" class="small">Compressed MCP summary</text>
      <text x="392" y="34" class="cell">Missing source detail</text>
      <text x="585" y="33" class="cell">Medium</text>
      <text x="714" y="25" class="cell">Bundle schema + source list</text>
      <text x="714" y="42" class="small">Require missing_evidence field</text>
    </g>

    <g transform="translate(0 216)">
      <rect x="0" y="0" width="988" height="56" fill="#f8faf9"/>
      <rect x="560" y="12" width="96" height="30" rx="15" fill="#fff1b8"/>
      <text x="24" y="34" class="row">Long/noisy returns</text>
      <text x="238" y="25" class="cell">Verbose text</text>
      <text x="238" y="42" class="small">Buried critical facts</text>
      <text x="392" y="34" class="cell">Evidence extraction drift</text>
      <text x="585" y="33" class="cell">Medium</text>
      <text x="714" y="25" class="cell">Extractor + citation contract</text>
      <text x="714" y="42" class="small">Track return chars and latency</text>
    </g>

    <g transform="translate(0 272)">
      <rect x="0" y="0" width="988" height="56" fill="#ffffff"/>
      <rect x="560" y="12" width="96" height="30" rx="15" fill="#ffdada"/>
      <text x="24" y="34" class="row">Permission errors</text>
      <text x="238" y="25" class="cell">403 / denied</text>
      <text x="238" y="42" class="small">No privileged evidence</text>
      <text x="392" y="34" class="cell">False completion</text>
      <text x="589" y="33" class="cell">High</text>
      <text x="714" y="25" class="cell">Policy gate + approval tool</text>
      <text x="714" y="42" class="small">Must report missing permission</text>
    </g>

    <g transform="translate(0 328)">
      <rect x="0" y="0" width="988" height="58" fill="#f8faf9"/>
      <rect x="560" y="13" width="96" height="30" rx="15" fill="#e6f6f4"/>
      <text x="24" y="35" class="row">Live adapter path</text>
      <text x="238" y="26" class="cell">MCP / HTTP / CLI</text>
      <text x="238" y="43" class="small">Real external systems</text>
      <text x="392" y="35" class="cell">Non-determinism + secrets</text>
      <text x="585" y="34" class="cell">Medium</text>
      <text x="714" y="26" class="cell">Adapter layer + redacted traces</text>
      <text x="714" y="43" class="small">Replay sanitized fixtures for regression</text>
    </g>
  </g>

  <g transform="translate(66 594)">
    <rect x="0" y="-20" width="18" height="18" rx="9" fill="#dff3ea"/>
    <text x="26" y="-6" class="note">Lower risk under controlled mock tools</text>
    <rect x="266" y="-20" width="18" height="18" rx="9" fill="#fff1b8"/>
    <text x="292" y="-6" class="note">Needs extraction and verifier</text>
    <rect x="526" y="-20" width="18" height="18" rx="9" fill="#ffdada"/>
    <text x="552" y="-6" class="note">Unsafe without gates</text>
    <text x="806" y="-6" class="note">Not a measured scorecard yet</text>
  </g>
</svg>
